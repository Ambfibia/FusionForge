[package]
name = "ffone-reference-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Editor-owned deterministic legacy-script and OpenFusion parity inventory"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
