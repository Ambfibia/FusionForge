[package]
name = "ffone-content"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "FusionForge-owned schema for validated intermediate FFOne content packs"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
